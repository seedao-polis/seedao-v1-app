# SeeDAO App (SPA) — HTTP (Certbot will add SSL after success)
# Upload to: /etc/nginx/conf.d/app-v1.seedao.xyz.conf
#
# Prerequisites:
# - DNS A: app-v1.seedao.xyz → this server
# - Frontend container: 127.0.0.1:3081 (seedao-v1-app; HOST_PORT in deploy/.env)
# - sudo mkdir -p /var/www/certbot

server {
    listen 80;
    listen [::]:80;
    server_name app-v1.seedao.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
