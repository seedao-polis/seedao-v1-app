# Build and publish the SeeDAO App image to GHCR (and optionally Aliyun ACR).

name: Docker publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: seedao-v1-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional China registry — set these repo secrets to enable:
      # ACR_REGISTRY, ACR_NAMESPACE, ACR_USERNAME, ACR_PASSWORD
      - name: Log in to Aliyun ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        if: env.ACR_USERNAME != '' && env.ACR_PASSWORD != '' && env.ACR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extra ACR tags
        id: acr
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        run: |
          if [ -n "$ACR_USERNAME" ] && [ -n "$ACR_REGISTRY" ] && [ -n "$ACR_NAMESPACE" ]; then
            short_sha="${GITHUB_SHA::7}"
            {
              echo "tags<<EOF"
              echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:latest"
              echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:sha-${short_sha}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.acr.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          ACR_ENABLED: ${{ steps.acr.outputs.enabled }}
          ACR_TAGS: ${{ steps.acr.outputs.tags }}
        run: |
          {
            echo "### Image published"
            echo ""
            echo "**GHCR tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "$ACR_ENABLED" = "true" ]; then
              echo "**ACR tags:**"
              echo '```'
              echo "$ACR_TAGS"
              echo '```'
            else
              echo "_ACR push skipped (set ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD to enable)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
