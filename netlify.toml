# CRA / react-app-rewired 在 Netlify 默认构建机上容易 OOM（日志里 “exited too early”）。
# 以下通过环境变量降低 webpack 构建峰值内存。

[build]
  command = "npm run build:prod"
  publish = "build"

[build.environment]
  # 默认镜像对 @seedao2.0/* 常 404；安装阶段统一走 npm 官方源（与 package-lock 中 resolved 一致）
  NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
  # 提高 V8 老生代堆上限（单位 MB）；可按计划档位再调 4096 / 8192
  NODE_OPTIONS = "--max-old-space-size=6144"
  # 关闭 production source map，显著减少构建期内存与耗时
  GENERATE_SOURCEMAP = "false"
  # Netlify 会设 CI=true，CRA 会把 ESLint warning 当 error 导致失败；生产构建跳过 ESLint 插件
  DISABLE_ESLINT_PLUGIN = "true"
